name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm install -g npm@11.10.0
          ./scripts/test

      - name: Publish Pact contract
        id: publish-pact
        if: success()
        continue-on-error: true
        run: |
          gh release download pact-contracts --pattern "*.json" --dir /tmp/existing-pact --clobber 2>/dev/null || true
          existing_file=$(ls /tmp/existing-pact/*.json 2>/dev/null | head -1)

          if [ -n "$existing_file" ] && diff -q <(jq -S . "$existing_file") <(jq -S . pacts/*.json) > /dev/null 2>&1; then
            echo "Contract unchanged since last publish - nothing to do"
          else
            echo "Contract changed (or no previous release exists) - publishing"
            gh release delete pact-contracts --yes || true
            gh release create pact-contracts pacts/*.json \
              --title "Pact contracts (latest)" \
              --notes "Auto-published from ${{ github.sha }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Test Repo
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.UI_TESTS_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DEFRA/ahwr-ui-tests/dispatches \
            -d '{"event_type": "run-tests", "client_payload": {"repo": "ahwr-public-user-ui"}}'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if Pact contract publish failed
        if: steps.publish-pact.outcome == 'failure'
        run: |
          echo "::error::Pact contract publish failed - ahwr-application-backend may verify against a stale contract until this is fixed."
          exit 1
