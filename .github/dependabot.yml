version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      dev:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      prod:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      security:
        applies-to: "security-updates"
        patterns:
          - "*"

      other:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    # Schedule run nightly
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"

    cooldown:
      default-days: 7

    versioning-strategy: increase

    ignore:
      # sass-loader pinned to 12.x: 16+ switched to the modern Sass API, which breaks the current @import-based SCSS build (deferred migration)
      - dependency-name: sass-loader
        update-types:
          - version-update:semver-major
      # ioredis pinned to 5.x: @hapi/catbox-redis 7.0.2 peers ioredis ^5; revisit when catbox-redis accepts ^6
      - dependency-name: ioredis
        update-types:
          - version-update:semver-major

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run nightly
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"

    cooldown:
      default-days: 7
